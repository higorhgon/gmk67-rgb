id: io.github.aloran_dev.Gmk67Rgb
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: gmk67-rgb
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the keyboard's /dev/hidraw*; access is granted by the system udev rule
  - --device=all
modules:
  - name: gmk67-rgb
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app UDEVDIR=
    sources:
      - type: dir
        path: ../..
